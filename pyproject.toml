[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaac-ai-agent"
version = "0.1.0"
description = "A workflow-driven AI system for generating The Binding of Isaac: Repentance mod code using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Agent Architect", email = "dev@isaac-agent.local"}
]
keywords = ["isaac", "modding", "ai", "langgraph", "code-generation", "lua"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.26",
    "langchain-openai>=0.0.11",
    "langchain-community>=0.0.13",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "typing-extensions>=4.8.0",
    "sentence-transformers>=2.2.0",
    "anthropic>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm-openai = [
    "langchain-openai>=0.0.11",
]

llm-glm = [
    "zhipuai>=1.0.0",
]

llm-deepseek = [
    "langchain-openai>=0.0.11",  # Deepseek uses OpenAI-compatible API
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "ipython>=8.16.0",
    "jupyter>=1.0.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

all-llms = [
    "langchain-openai>=0.0.11",
    "zhipuai>=1.0.0",
]

desktop = [
    "PyQt6>=6.5.0",
    "PyQt6-QScintilla>=2.14.0",
    "Pygments>=2.15.0",
]

[tool.uv]
required-version = ">=0.4.0"

[tool.hatch.build.targets.wheel]
packages = ["src/isaac_agent"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "S",
    "C",
    "B",
    "A",
]
ignore = ["S101", "S104"]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "faiss.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=src --cov-report=html --cov-report=term"

services:
  isaac-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: isaac-agent-ui:latest
    container_name: isaac-ui
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/app/docs:ro
      - ./processed_docs:/app/processed_docs
      - ./data:/app/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
    command: python -m isaac_agent.ui.app
    stdin_open: true
    tty: true

  isaac-api:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: isaac-agent-ui:latest
    container_name: isaac-api
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs:ro
      - ./processed_docs:/app/processed_docs
      - ./data:/app/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
    command: uvicorn isaac_agent.api:app --host 0.0.0.0 --port 8000
    stdin_open: true
    tty: true
